<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2d3139" />
      <stop offset="100%" stop-color="#0f1115" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />
  <!-- Outer border ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ringGrad)" stroke-width="14" filter="url(#shadow)" />
  <!-- Tick marks (every 30 deg for hours) -->
  <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="70" x2="256" y2="84" />
    <line x1="256" y1="428" x2="256" y2="442" />
    <line x1="70" y1="256" x2="84" y2="256" />
    <line x1="428" y1="256" x2="442" y2="256" />
    <!-- 30 deg lines -->
    <line x1="346" y1="100" x2="339" y2="112" />
    <line x1="166" y1="412" x2="173" y2="400" />
    <!-- 60 deg lines -->
    <line x1="412" y1="166" x2="400" y2="173" />
    <line x1="100" y1="346" x2="112" y2="339" />
    <!-- 120 deg lines -->
    <line x1="412" y1="346" x2="400" y2="339" />
    <line x1="100" y1="166" x2="112" y2="173" />
    <!-- 150 deg lines -->
    <line x1="346" y1="412" x2="339" y2="400" />
    <line x1="166" y1="100" x2="173" y2="112" />
  </g>
  <!-- Clock hands -->
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="256" y2="150" stroke="#f1f5f9" stroke-width="12" stroke-linecap="round" transform="rotate(45, 256, 256)" />
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="256" y2="100" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" transform="rotate(160, 256, 256)" />
  <!-- Second hand (Red) -->
  <line x1="256" y1="290" x2="256" y2="80" stroke="#ef4444" stroke-width="3" stroke-linecap="round" transform="rotate(310, 256, 256)" />
  <!-- Center pivot -->
  <circle cx="256" cy="256" r="12" fill="#ef4444" />
  <circle cx="256" cy="256" r="4" fill="#f87171" />
</svg>
